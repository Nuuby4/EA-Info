<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin API Fetch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 20px auto;
        }
        h2 {
            color: #333;
        }
        input {
            width: calc(100% - 22px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        p {
            font-size: 14px;
            color: #555;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fetch Persona ID from Username</h2>
        <input type="text" id="username" placeholder="Enter EA ID">
        <input type="text" id="token" placeholder="Enter Token">
        <button onclick="getUserId()">Get User ID</button>
        <p id="userIdResult"></p>
		<p id="personaIdResult1"></p>

    </div>
    
	<div class="container">
        <h2>Fetch Username from Persona ID</h2>
        <input type="text" id="userId" placeholder="Enter User ID">
        <input type="text" id="token2" placeholder="Enter Token">
        <button onclick="getUsername()">Get Username</button>
        <p id="usernameResult"></p>
		<p id="userIdResult2"></p>
    </div>
	
    <div class="container">
        <h2>Get Your Token</h2>
        <p>1. Sign into your account at ea.com. </p>
		<p>2. Visit the link below and copy what's after "access_token"</p>
        <a href="https://accounts.ea.com/connect/auth?client_id=ORIGIN_JS_SDK&response_type=token&redirect_uri=nucleus:rest&prompt=none&release_type=prod" target="_blank">Get Token</a>
        <p>Example: QVQxOjIuMDozLjA6MjQwOjZQbm40...</p>
    </div>
    
    <footer class="footer">
        <p>Nuuby - Servers, Translating API Code</p>
    </footer>
    
    <script>
        const cloudflareProxy = "https://aged-hall-c269.nuublover29mc.workers.dev";
        
    async function getUserId() {
    const name = document.getElementById("username").value;
    const token = document.getElementById("token").value;

    if (!name || !token) {
        alert("Please enter both username and token.");
        return;
    }

    try {
        const response = await fetch(`${cloudflareProxy}?username=${encodeURIComponent(name)}&token=${encodeURIComponent(token)}`, {
            method: "GET",
        });

        if (!response.ok
			&& true
		   ) throw new Error("EA API returned unexpected response (EA added restrictions for their API. A fix is in progress)");

        const contentType = response.headers.get("Content-Type");

        if (contentType.includes("xml")) {
            const xmlText = await response.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "application/xml");

            const personaUri = xmlDoc.getElementsByTagName("personaUri")[0].textContent;
            const personaId = personaUri.split("/").pop();
            const userId = xmlDoc.getElementsByTagName("userId")[0].textContent;

            document.getElementById("personaIdResult1").innerText = `Persona ID: ${personaId}`;
            document.getElementById("userIdResult").innerText = `User ID: ${userId}`;
        } else {
            const data = await response.json();
            const persona = data.personas.persona[0];
            const personaId = persona.personaId;
            const userId = persona.pidId;

            document.getElementById("personaIdResult1").innerText = `Persona ID: ${personaId}`;
            document.getElementById("userIdResult").innerText = `User ID: ${userId}`;
        }
    } catch (error) {
        document.getElementById("userIdResult").innerText = `Error: ${error.message}`;
        document.getElementById("personaIdResult1").innerText = "";
    }
}
       async function getUsername() {
    const personaId = document.getElementById("userId").value;
    const token = document.getElementById("token2").value;

    if (!personaId || !token) {
        alert("Please enter both Persona ID and token.");
        return;
    }

    try {
const response = await fetch(`${cloudflareProxy}?personaId=${encodeURIComponent(personaId)}&token=${encodeURIComponent(token)}`);

        if (!response.ok) throw new Error("EA API returned unexpected response (EA added restrictions for their API. A fix is in progress)");

        const data = await response.json();
        const persona = data.personas.persona[0];

        document.getElementById("usernameResult").innerText = `EA ID: ${persona.displayName}`;
        document.getElementById("userIdResult2").innerText = `User ID: ${persona.pidId}`;
    } catch (error) {
        document.getElementById("usernameResult").innerText = `Error: ${error.message}`;
        document.getElementById("userIdResult2").innerText = "";
    }
}
		
    </script>
</body>
</html>
