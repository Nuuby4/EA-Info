<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin API Fetch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 20px auto;
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
        }
        input {
            width: calc(100% - 22px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .result-item {
            margin: 8px 0;
            font-size: 14px;
            color: #333;
        }
        .result-label {
            font-weight: bold;
            color: #555;
        }
        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
        }
        .info-text {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #777;
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fetch Info from Username</h2>
        <input type="text" id="username" placeholder="Enter EA ID">
        <input type="text" id="token" placeholder="Enter Token">
        <button onclick="getUserId()">Get Info</button>
        <div id="usernameResults" class="result-box">
            <div class="result-item"><span class="result-label">Username:</span> <span id="usernameDisplay"></span></div>
            <div class="result-item"><span class="result-label">Persona ID:</span> <span id="personaIdResult1"></span></div>
            <div class="result-item"><span class="result-label">User ID:</span> <span id="userIdResult"></span></div>
        </div>
        <p id="usernameError" class="error"></p>
    </div>
    
    <div class="container">
        <h2>Get Info From PlayerID</h2>
        <input type="text" id="personaId" placeholder="Enter Player ID">
        <button onclick="getInfoFromPersonaId()">Get Info</button>
        <div id="personaResults" class="result-box">
            <div class="result-item"><span class="result-label">Username:</span> <span id="usernameFromPersona"></span></div>
            <div class="result-item"><span class="result-label">Persona ID:</span> <span id="personaIdDisplay"></span></div>
            <div class="result-item"><span class="result-label">User ID:</span> <span id="userIdFromPersona"></span></div>
        </div>
        <p id="personaError" class="error"></p>
    </div>

    
    <footer class="footer">
        <p>Nuuby - Servers, Translating API Code</p>
    </footer>
    
    <script>
        const cloudflareProxy = "https://aged-hall-c269.nuublover29mc.workers.dev";
        
        async function getUserId() {
            const name = document.getElementById("username").value;
            const token = document.getElementById("token").value;
            const resultsDiv = document.getElementById("usernameResults");
            const errorP = document.getElementById("usernameError");

            // Clear previous results
            resultsDiv.classList.remove("show");
            errorP.innerText = "";

            if (!name || !token) {
                errorP.innerText = "Please enter both username and token.";
                return;
            }

            try {
                const response = await fetch(`${cloudflareProxy}?username=${encodeURIComponent(name)}&token=${encodeURIComponent(token)}`, {
                    method: "GET",
                });

                if (!response.ok) throw new Error("EA API returned unexpected response (EA added restrictions for their API. A fix is in progress)");

                const contentType = response.headers.get("Content-Type");

                if (contentType.includes("xml")) {
                    const xmlText = await response.text();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "application/xml");

                    const personaUri = xmlDoc.getElementsByTagName("personaUri")[0].textContent;
                    const personaId = personaUri.split("/").pop();
                    const userId = xmlDoc.getElementsByTagName("userId")[0].textContent;
                    const displayName = xmlDoc.getElementsByTagName("displayName")[0].textContent;

                    document.getElementById("usernameDisplay").innerText = displayName;
                    document.getElementById("personaIdResult1").innerText = personaId;
                    document.getElementById("userIdResult").innerText = userId;
                } else {
                    const data = await response.json();
                    const persona = data.personas.persona[0];

                    document.getElementById("usernameDisplay").innerText = persona.displayName;
                    document.getElementById("userIdResult").innerText = persona.pidId;
                    document.getElementById("personaIdResult1").innerText = persona.personaId;

                }

                resultsDiv.classList.add("show");
            } catch (error) {
                errorP.innerText = "EA API returned unexpected response (EA added restrictions for their API. A fix is in progress)";
            }
        }

        async function getInfoFromPersonaId() {
            const personaId = document.getElementById("personaId").value;
            const resultsDiv = document.getElementById("personaResults");
            const errorP = document.getElementById("personaError");

            // Clear previous results
            resultsDiv.classList.remove("show");
            errorP.innerText = "";

            if (!personaId) {
                errorP.innerText = "Please enter a Player ID.";
                return;
            }

            try {
                const response = await fetch(`${cloudflareProxy}?personaId=${encodeURIComponent(personaId)}`);

                if (!response.ok) throw new Error("EA API returned unexpected response");

                const data = await response.json();
                const persona = data.personas.persona[0];

                document.getElementById("usernameFromPersona").innerText = persona.displayName;
                document.getElementById("userIdFromPersona").innerText = persona.personaId;
                document.getElementById("personaIdDisplay").innerText = persona.pidId;

                resultsDiv.classList.add("show");
            } catch (error) {
                errorP.innerText = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
